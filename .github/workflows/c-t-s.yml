name: c-t-s.

on:
  schedule:
    - cron: "0 0-4,12-23 * * *"
  workflow_dispatch:   # lets you run it manually to test

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: c-t-s
        run: |
          git config user.name  "Haroonhsa007"
          git config user.email "haroonhsa1234@gmail.com"

          COUNT=$(shuf -i 50-100 -n 1)
          echo "Making $COUNT commits"

          for i in $(seq 1 "$COUNT"); do
            echo "$(date -Is) - update $i" >> activity.log
            git add activity.log
            git commit -q -m "chore: update $i/$COUNT"
          done

          git push
